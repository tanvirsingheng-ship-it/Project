<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        SupplyAI
        {% endblock %}
    </title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #111827;
        }

        .navbar {
            height: 70px;
            background: #111827;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6%;
        }

        .logo a {
            color: white;
            text-decoration: none;
            font-size: 23px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-links a {
            color: #d1d5db;
            text-decoration: none;
            font-size: 14px;
            transition: 0.2s;
        }

        .nav-links a:hover {
            color: white;
        }

        .nav-links a.active {
            color: white;
            font-weight: bold;
        }

        .page-container {
            width: 90%;
            max-width: 1200px;
            margin: 40px auto;
        }

        @media (max-width: 1000px) {

            .nav-links {
                gap: 10px;
            }

            .nav-links a {
                font-size: 12px;
            }

        }

        @media (max-width: 750px) {

            .navbar {
                height: auto;
                padding: 18px;
                flex-direction: column;
                gap: 15px;
            }

            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
            }

        }

    </style>

    {% block extra_css %}
    {% endblock %}

</head>


<body>

    <nav class="navbar">

        <div class="logo">

            <a href="/">
                SupplyAI
            </a>

        </div>


        <div class="nav-links">

            <a href="/">Home</a>

            <a href="/dashboard.html">
                Dashboard
            </a>

            <a href="/search.html">
                AI Search
            </a>

            <a href="/prediction.html">
                Prediction
            </a>

            <a href="/chatbot.html">
                AI Chatbot
            </a>

            <a href="/voice.html">
                Voice
            </a>

            <a href="/insights.html">
                Insights
            </a>

            <a href="/risk-monitor.html">
                Risk Monitor
            </a>

        </div>

    </nav>

    <main class="page-container">

        {% block content %}
        {% endblock %}

    </main>


    {% block extra_js %}
    {% endblock %}

</body>

</html>
